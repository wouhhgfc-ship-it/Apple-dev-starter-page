<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="paystack.css">
    <title>Pay Stack Login

    </title>
</head>

<body>
    <main>
        <header><span><img src="img-paystack/paystack-dashboard.svg.083e06944f90860d3454.Woblo.svg"
                    alt="paystack-logo"></span>
        </header>
        <section>
            <h1>Sign in to your account</h1>
            <form action="login" method="post" class="login-form">
                <div>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <img class="password-toggle-icon" src="img-paystack/paystack-dashboard.svg.svg-1.Woblo.svg"
                        alt="Toggle password visibility">

                </div>
                <button type="submit">Sign in</button>
            </form>
            <footer class="login-footer">
                <p><a href="" class="login-a">Sign in with passkey</a></p>
                <p><a href="" class="login-a">Sign in with Single Sign-On (SSO)</a></p>
            </footer>
        </section>

        <footer class="mine-footer">
            <p>New to Paystack?<span id="sign-up"><a href="" class="footer-a">Sign up</a></span> </p>
            <a href="" class="footer-a">Forgot your password?</a>
        </footer>
    </main>
</body>

</html>
